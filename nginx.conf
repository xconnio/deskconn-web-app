server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    location = /sw-download.js {
        alias /usr/share/nginx/html/app/sw-download.js;
    }

    # The host nginx serves the marketing site at "/" and only proxies these
    # paths here — auth views used to live under /app/ by accident of the
    # build's asset base, they're now proxied as their own top-level paths.
    location ~ ^/(app|login|register|verify|forgot-password)(/|$) {
        try_files $uri $uri/ /app/index.html;
    }
}
